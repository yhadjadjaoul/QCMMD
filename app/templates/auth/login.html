{% extends "base.html" %}

{% block title %}{{ _('login') }} - QCM Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card main-card p-4">
            <h3 class="card-title text-center mb-4 fw-bold text-primary">
                <i class="bi bi-box-arrow-in-right me-2"></i>{{ _('login') }}
            </h3>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('email') }}</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('password') }}</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <!-- Captcha Section -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('captcha') }}</label>
                    <div class="d-flex align-items-center mb-2">
                        <img id="captchaImage" src="{{ url_for('auth.get_captcha') }}" alt="Captcha" class="border rounded me-2" style="height: 50px;">
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('captchaImage').src = '{{ url_for('auth.get_captcha') }}?' + Math.random();" title="{{ _('refresh_captcha') }}">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <input type="text" name="captcha" class="form-control text-uppercase" placeholder="{{ _('enter_captcha') }}" autocomplete="off" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    {{ _('login') }}
                </button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">
                    Don't have an account? <a href="{{ url_for('auth.register') }}">{{ _('register') }}</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
