{% extends "base.html" %}

{% block title %}{{ _('login') }} - QCM Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card main-card p-4">
            <h3 class="card-title text-center mb-4 fw-bold text-primary">
                <i class="bi bi-box-arrow-in-right me-2"></i>{{ _('login') }}
            </h3>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('email') }}</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('password') }}</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    {{ _('login') }}
                </button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">
                    Don't have an account? <a href="{{ url_for('auth.register') }}">{{ _('register') }}</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
