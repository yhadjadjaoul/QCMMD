{% extends "base.html" %}

{% block title %}{{ _('register') }} - QCM Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card main-card p-4">
            <h3 class="card-title text-center mb-4 fw-bold text-primary">
                <i class="bi bi-person-plus-fill me-2"></i>{{ _('register') }}
            </h3>
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('username') }}</label>
                    <input type="text" name="username" class="form-control" placeholder="johndoe" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('email') }}</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('password') }}</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ _('role') }}</label>
                    <select name="role" class="form-select">
                        <option value="student">{{ _('student') }}</option>
                        <option value="professor">{{ _('professor') }}</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    {{ _('register') }}
                </button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">
                    Already have an account? <a href="{{ url_for('auth.login') }}">{{ _('login') }}</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
